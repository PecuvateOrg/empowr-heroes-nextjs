[build]
  base    = "src"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from   = "/legal/*"
  to     = "https://legalhub.pecuvate.com/share/empowr/heroes/:splat"
  status = 200
  force  = true

# These cover CDN-served static files only (favicons, badges, og-image).
# Runtime-rendered HTML bypasses this block entirely — those headers are set in
# src/next.config.ts. Both copies are required; keep the values identical.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
